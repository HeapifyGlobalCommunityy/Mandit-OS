# Tool configuration only. Dependencies live in requirements*.txt (CONTRIBUTING §4.1).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrations are hand-written SQL; long statement lines are expected.
"services/core/migrations/versions/*.py" = ["E501"]
# FastAPI dependency injection uses Depends in default parameter values.
"**/api.py" = ["B008"]

[tool.ruff.format]
# Keep the hand-written SQL migrations exactly as their owners wrote them.
exclude = ["services/core/migrations/versions/*.py"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/core"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["services/core/tests"]
pythonpath = ["services/core"]
addopts = "-ra"

[tool.ruff.lint.isort]
known-first-party = ["mandit"]

# Attacker mints its own credential under a key id that is not in Mandit's issuer key set.
id: ATK-IMP-003
title: Self-issued KYA JWT with a foreign kid
threat_class: T2_AGENT_IMPERSONATION
family: foreign_kid
severity: HIGH
version: 1
mode: scripted
credential_attack: foreign_kid
steps:
  - tool: transaction.open
    credential: forged
    expect_status: DENIED
expected:
  outcome_in: [DENIED]
  token_issued: false
  payment_executed: false
  reason_codes_include_any: [KYA_TOKEN_INVALID]
  ledger_events_include: [AGENT_AUTH_FAILED]
controls_under_test: [kya_jwt_verify]
